# Rendered by scripts/configure.sh -> @BIG@/conf/kafka.properties
# Single lightweight Kafka broker in KRaft mode (no ZooKeeper needed).
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
# Clients on the workers (Spark executors) connect to this address
advertised.listeners=PLAINTEXT://@MASTER_IP@:9092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=@BIG@/data/kafka
num.partitions=2
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=true

# Keep disk usage tiny
log.retention.hours=24
log.retention.bytes=268435456
log.segment.bytes=67108864
num.network.threads=2
num.io.threads=4
